# Builds a static review copy of the PHP site and publishes it to GitHub Pages.
# The live site (Hostinger) runs the PHP app itself; this preview is for design review only.
name: Deploy review preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP version
        run: php -v

      - name: Lint PHP
        run: find app public scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build static preview
        env:
          APP_BASE_PATH: /${{ github.event.repository.name }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: php scripts/export-static.php _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
