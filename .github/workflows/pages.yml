# Builds a static review copy of the PHP site and publishes it to GitHub Pages.
# The live site (Hostinger) runs the PHP app itself; this preview is for design review only.
name: Deploy review preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP version
        run: php -v

      - name: Lint PHP
        run: find app public scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      # With a custom domain (repository variable PAGES_CUSTOM_DOMAIN, e.g. www.example.com)
      # the site is served from the domain root; otherwise from /<repo-name>/ on github.io.
      - name: Build static preview
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            export APP_BASE_PATH="" APP_URL="https://$CUSTOM_DOMAIN"
          else
            export APP_BASE_PATH="/$REPO" APP_URL="https://$OWNER.github.io/$REPO"
          fi
          echo "Building for $APP_URL"
          php scripts/export-static.php _site
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > _site/CNAME; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
