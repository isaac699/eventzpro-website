# Render preview hosting: only public/ is reachable from the web
<VirtualHost *:80>
    DocumentRoot /var/www/site/public

    <Directory /var/www/site/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Everything outside public/ (app code, content, storage) is refused
    <Directory /var/www/site>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
